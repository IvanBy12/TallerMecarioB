name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tallermecario_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tallermecario_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tallermecario_ci

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history, not the default shallow clone: the secret scan
          # checks the whole git log for a committed .env, not just HEAD.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        run: npm run security:secret-scan

      - name: Dependency audit (zero production vulnerabilities)
        run: npm audit --omit=dev

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: R2 presigned PUT security (no R2 credentials)
        run: npm run test:media:presign:ci

      - name: RBAC matrix and TenantContext core (S1-02, no database)
        run: |
          npm run test:authz
          npm run test:tenant-context-core

      # GitHub Actions runs these steps in order. Each DB suite uses its own
      # disposable database; never launch migration suites in parallel here.
      - name: Clean migration and PostgreSQL suite
        run: npm run test:db:sprint0:ci

      - name: RBAC and TenantContext PostgreSQL foundations (S1-02)
        run: |
          npm run test:authz:db:ci
          npm run test:tenant-context:db:ci

      - name: Fastify multitenant API
        run: npm run test:api:multitenant:ci

      - name: TenantContext + RBAC request lifecycle (S1-02)
        run: npm run test:tenant-context:api:ci

      # Hermetic: per-run RSA/Svix keys and a fake Clerk Backend API; no Clerk
      # instance, no secrets, no internet (the runner strips CLERK_* vars).
      - name: Clerk identity lifecycle (S1-03)
        run: |
          npm run test:identity:ci
          npm run test:identity:upgrade:ci

      - name: API health/readiness, CORS, rate limiting, security headers
        run: npm run test:api:security:ci

      - name: Workshop onboarding (S1-01)
        run: npm run test:onboarding:ci

      - name: Membership invitations (S1-04)
        run: |
          npm run test:invitations:ci
          npm run test:invitations:upgrade:ci

      - name: Membership roles (S1-05)
        run: |
          npm run test:member-roles:ci
          npm run test:member-roles:upgrade:ci

      - name: Membership lifecycle (S1-06)
        run: |
          npm run test:member-lifecycle:ci
          npm run test:member-lifecycle:upgrade:ci

      - name: Sprint 1 audit (S1-07)
        run: |
          npm run test:audit:ci
          npm run test:audit:upgrade:ci

      - name: Final cross-tenant isolation (S1-08)
        run: npm run test:cross-tenant:final:ci

      # Each CRM suite creates and cleans up its own disposable database.
      # Keep upgrade and API runs serial with the other PostgreSQL suites.
      - name: CRM PostgreSQL integrity (S2-01 to S2-03)
        run: npm run test:crm:db:ci

      - name: CRM migration upgrade (S2-01 to S2-03)
        run: npm run test:crm:upgrade:ci

      - name: Reception PostgreSQL integrity (S3-02)
        run: npm run test:reception:db:ci

      - name: Reception migration upgrade (S3-02)
        run: npm run test:reception:upgrade:ci

      - name: CRM customer, vehicle, and ownership API (S2-04 to S2-06)
        run: npm run test:crm:api:ci

      - name: Reception create API (S3-03)
        run: npm run test:reception:api:ci

      - name: Shared runtime database role boundary
        run: npm run test:runtime:db:ci

      - name: Outbox worker regression
        run: npm run test:outbox:ci

      - name: Wompi contract and integration regression
        run: npm run test:wompi

      - name: Concurrent-migration lock protection
        run: npm run test:db:migration-lock:ci

      - name: RBAC documentation parity
        run: npm run rbac:check-doc-parity

  # The expensive mutation gate runs on integration, the Sprint 2 final gate
  # branch (S2-08 T9: dispatch is unavailable until ci.yml reaches main) and
  # explicit pre-release dispatch, after the regular validation job has passed.
  mutations:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || (github.event_name == 'push' && (github.ref == 'refs/heads/integration/sprint-2' || github.ref == 'refs/heads/integration/sprint-3' || github.ref == 'refs/heads/codex/s3-02-postgres-invariants' || github.ref == 'refs/heads/task/s2-08-final-quality-gate'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: tallermecario_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tallermecario_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/tallermecario_ci
      # Mutation runners classify kills from spec-reporter "✖ name (Nms)" lines.
      # Node 22 defaults to TAP when stdout is not a TTY, which turns every
      # killed mutant into INVALID; pin the reporter the runners parse.
      NODE_OPTIONS: --test-reporter=spec

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Mutation runners create disposable databases and must run serially.
      - name: Sprint 1 role mutations
        run: npm run test:member-roles:mutations:ci

      - name: Sprint 1 membership lifecycle mutations
        run: npm run test:member-lifecycle:mutations:ci

      - name: Sprint 1 audit mutations
        run: npm run test:audit:mutations:ci

      - name: Sprint 1 cross-tenant mutations
        run: npm run test:cross-tenant:mutations:ci

      - name: CRM database mutations
        run: npm run test:crm:mutations:ci

      - name: Reception database mutations (S3-02)
        run: npm run test:reception:mutations:ci

      - name: CRM customer API mutations
        run: npm run test:crm:api:mutations:ci

      - name: CRM vehicle API mutations
        run: npm run test:crm:vehicle:mutations:ci

      - name: CRM ownership API mutations
        run: npm run test:crm:ownership:mutations:ci

      - name: Request logging privacy mutation
        run: npm run test:request-logging:mutation:ci

  staging:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Sprint 2 extends the disposable Sprint 0 stack with a hermetic Clerk
      # verifier, migration ledger/idempotency, deployed CRM E2E for two
      # tenants, logging privacy and data-preserving bad-config recovery.
      # The drill writes gate results to GITHUB_STEP_SUMMARY on pass or fail.
      - name: Build, migrate, CRM E2E and rollback in disposable staging
        run: npm run staging:deploy-drill:ci
